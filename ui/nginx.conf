server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the UI calls /api/*; strip the prefix and forward to the API container
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
