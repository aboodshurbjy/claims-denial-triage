services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - triage-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  ui:
    build: ./ui
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  triage-data:
